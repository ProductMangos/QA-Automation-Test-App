<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="description" content="QA Testing Web App">

  <title>QA Test Automation Playground</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="scene">
    <!-- Orbit Rings -->
    <div class="orbit orbit-1">
      <span class="dot"></span>
    </div>

    <div class="orbit orbit-2">
      <span class="dot"></span>
    </div>

    <div class="orbit orbit-3">
      <span class="dot-2"></span>
    </div>

    <div class="orbit orbit-4">
      <span class="dot-3"></span>
    </div>

    <div class="orbit orbit-5">
      <span class="dot-4"></span>
    </div>

    <div class="orbit orbit-6">
      <span class="dot-5"></span>
    </div>

    <div class="orbit orbit-7">
      <span class="dot-6"></span>
    </div>
    <!-- Login Card -->
    <form id="loginForm">
        <div class="login-card" role="main">
          <h2>Login Test</h2>
          <label for="username">Username:</label>
          <input id="username" type="text" placeholder="Username" required/>
          <label for="password">Password</label>
          <input id="password" placeholder="Password" required/>
          <button type="submit">Sign In</button>
          <div id="error">Username or Password is incorrect.</div>
        </div>
    </form>

  </div>
  <script src="login.js"></script>
</body>
</html>
